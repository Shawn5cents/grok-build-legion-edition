name: Legion Edition 2.0 CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    name: 🦀 Rust Code Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install dotslash
        run: cargo install dotslash --version 0.5.7 --locked

      - name: Cargo Check
        run: cargo check --workspace

      - name: Cargo Format Check
        run: cargo fmt --check --all

      - name: Cargo Test
        run: cargo test --workspace

  python-tools-check:
    name: 🐍 Python Auto-Discovery Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Legion Control Tools
        run: |
          python3 -m py_compile tools/*.py tools/tests/*.py
          python3 -m unittest discover -s tools/tests -v
          python3 tools/auto-discover.py --help
          python3 tools/legion-mode.py --help
          python3 tools/legion-config.py --help
          python3 tools/legion-hub.py --help
          bash -n install.sh bin/legion tools/switch-subagents.sh
          python3 -c 'import glob,tomllib; [tomllib.load(open(path, "rb")) for path in glob.glob("presets/*.toml")]'

  release-binary-build:
    name: 📦 Release Binary Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install dotslash
        run: cargo install dotslash --version 0.5.7 --locked

      - name: Build Release Binary
        run: cargo build --release -p xai-grok-pager-bin
