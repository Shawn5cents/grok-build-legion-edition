name: Legion CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    name: 🦀 Rust Code Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install DotSlash
        run: cargo install dotslash --version 0.5.9 --locked

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --workspace

      - name: Cargo Format Check
        run: cargo fmt --check --all

      - name: Cargo Test
        run: cargo test --workspace

  python-tools-check:
    name: 🐍 Python Auto-Discovery Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify Legion Control Tools
        run: |
          python3 -m py_compile tools/*.py tools/tests/*.py
          python3 -m unittest discover -s tools/tests -v
          python3 tools/auto-discover.py --help
          python3 tools/legion-mode.py --help
          python3 tools/legion-config.py --help
          python3 tools/legion-hub.py --help
          bash -n install.sh bin/legion tools/switch-subagents.sh
          python3 -c 'import glob,tomllib; [tomllib.load(open(path, "rb")) for path in glob.glob("presets/*.toml")]'

  release-binary-build:
    name: 📦 Release Binary Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install DotSlash
        run: cargo install dotslash --version 0.5.9 --locked

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release -p xai-grok-pager-bin
