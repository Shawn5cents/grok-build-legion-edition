[preset]
required_env = ["OPENCODE_API_KEY"]

[subagents]
enabled = true

[subagents.models]
orchestrator = "opencode/big-pickle"
explore = "opencode/deepseek-v4-flash-free"
architect = "opencode/big-pickle"
implementor = "opencode/big-pickle"
verifier = "opencode/big-pickle"
plan = "opencode/big-pickle"
general-purpose = "opencode/big-pickle"

[subagents.fallback]
verifier = "opencode/big-pickle"

[model."opencode/big-pickle"]
model = "big-pickle"
base_url = "https://api.opencode.ai/v1"
name = "OpenCode Big Pickle"
env_key = "OPENCODE_API_KEY"
context_window = 200000

[model."opencode/deepseek-v4-flash-free"]
model = "deepseek-v4-flash-free"
base_url = "https://api.opencode.ai/v1"
name = "DeepSeek V4 Flash Free (OpenCode)"
env_key = "OPENCODE_API_KEY"
context_window = 1000000
